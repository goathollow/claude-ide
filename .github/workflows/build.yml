# Builds the standalone executable on each platform. Run it from the Actions tab
# to download the builds from the run's page, or push a version tag (v1.2.3) to
# also attach them to a GitHub release.
name: Build executables

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-26-intel, target: macos-x64 }
          # The oldest Ubuntu runners, so the Linux builds work on older glibc too.
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:exe
      # tar keeps the executable bit, which artifacts and releases don't.
      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = Windows ]; then
            cp dist/claude-ide.exe out/claude-ide-${{ matrix.target }}.exe
          else
            tar -czf out/claude-ide-${{ matrix.target }}.tar.gz -C dist claude-ide
          fi
      - uses: actions/upload-artifact@v7
        with:
          path: out/*
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          find out -type f -exec gh release upload "$TAG" --clobber {} +
